<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 764" role="img" aria-labelledby="title desc">
<title id="title">Select task inputs</title><desc id="desc">Register relevant sources, record reasons for non-applicability and ask about unknowns.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527273"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173e40;font-size:17px}.title{font-size:25px;font-weight:650}.note{font-size:15px;fill:#516c70}.label{font-size:15px;font-weight:600}</style>
<rect width="820" height="764" rx="16" fill="#f8fbfb"/><text x="32" y="43" class="title">Select task inputs</text>
<text x="410" y="78" text-anchor="middle" class="note"><tspan x="410" dy="0">Project type suggests questions; task scope determines applicability.</tspan></text><rect x="200" y="108" width="420" height="70" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="137.5" text-anchor="middle" class=""><tspan x="410" dy="0">Confirm project facts</tspan><tspan x="410" dy="23">Goal · type · toolchain · task scope</tspan></text><rect x="200" y="226" width="420" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="262" text-anchor="middle" class=""><tspan x="410" dy="0">Discuss candidate inputs</tspan></text><path d="M 410 322 L 525 364 L 410 406 L 295 364 Z" fill="#fff3dd" stroke="#bda36b"/><text x="410" y="369" text-anchor="middle" class=""><tspan x="410" dy="0">Applicable?</tspan></text><rect x="20" y="464" width="235" height="76" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="137.5" y="496.5" text-anchor="middle" class=""><tspan x="137.5" dy="0">Not applicable</tspan><tspan x="137.5" dy="23">Record the reason</tspan></text><rect x="292" y="464" width="236" height="76" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="496.5" text-anchor="middle" class=""><tspan x="410" dy="0">Confirm source</tspan><tspan x="410" dy="23">Record version / hash</tspan></text><rect x="565" y="464" width="235" height="76" rx="10" fill="#fff3dd" stroke="#82aaa6"/><text x="682.5" y="496.5" text-anchor="middle" class=""><tspan x="682.5" dy="0">Keep pending</tspan><tspan x="682.5" dy="23">Ask for missing facts</tspan></text><rect x="260" y="596" width="300" height="66" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="623.5" text-anchor="middle" class=""><tspan x="410" dy="0">Register and link to task</tspan><tspan x="410" dy="23">manifest → acceptance</tspan></text><path d="M 410 178 V 226" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 286 V 322" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 295 364 H 138 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 406 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 525 364 H 682 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 540 V 596" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><text x="189" y="349" text-anchor="middle" class="label"><tspan x="189" dy="0">No</tspan></text><text x="443" y="440" text-anchor="middle" class="label"><tspan x="443" dy="0">Yes</tspan></text><text x="626" y="348" text-anchor="middle" class="label"><tspan x="626" dy="0">Unknown</tspan></text><path d="M 800 502 H 809 V 256 H 620" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="410" y="710" text-anchor="middle" class="note"><tspan x="410" dy="0">Custom input types are supported.</tspan><tspan x="410" dy="23">UI, API and Design Tokens are selected only when relevant.</tspan></text>
</svg>
