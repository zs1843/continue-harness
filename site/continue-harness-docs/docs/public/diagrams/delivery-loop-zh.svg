<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 730" role="img" aria-labelledby="title desc">
<title id="title">需求到验收的闭环</title><desc id="desc">确认范围后定义标准，再实现、验证和交接。未通过则修正或记录风险。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527273"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173e40;font-size:17px}.title{font-size:25px;font-weight:650}.note{font-size:15px;fill:#516c70}.label{font-size:15px;font-weight:600}</style>
<rect width="820" height="730" rx="16" fill="#f8fbfb"/><text x="32" y="43" class="title">需求到验收的闭环</text>
<text x="410" y="77" text-anchor="middle" class="note"><tspan x="410" dy="0">验收标准在实现前确认。</tspan></text><rect x="220" y="100" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="136" text-anchor="middle" class=""><tspan x="410" dy="0">确认需求与范围</tspan></text><rect x="220" y="195" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="231" text-anchor="middle" class=""><tspan x="410" dy="0">定义验收项与通过标准</tspan></text><rect x="220" y="290" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="326" text-anchor="middle" class=""><tspan x="410" dy="0">实现关联的工作项</tspan></text><rect x="220" y="385" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="421" text-anchor="middle" class=""><tspan x="410" dy="0">执行检查，保存验收证据</tspan></text><rect x="220" y="600" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="636" text-anchor="middle" class=""><tspan x="410" dy="0">保存交接状态与快照</tspan></text><path d="M 410 469 L 520 505 L 410 541 L 300 505 Z" fill="#fff3dd" stroke="#bda36b"/><text x="410" y="510" text-anchor="middle" class=""><tspan x="410" dy="0">验收通过？</tspan></text><rect x="30" y="475" width="205" height="60" rx="10" fill="#fff3dd" stroke="#82aaa6"/><text x="132.5" y="499.5" text-anchor="middle" class=""><tspan x="132.5" dy="0">修正实现，或记录</tspan><tspan x="132.5" dy="23">阻塞 / 延期</tspan></text><path d="M 410 160 V 195" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 255 V 290" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 350 V 385" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 445 V 469" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 541 V 600" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300 505 H 235" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><text x="443" y="576" text-anchor="middle" class="label"><tspan x="443" dy="0">通过</tspan></text><text x="264" y="489" text-anchor="middle" class="label"><tspan x="264" dy="0">未通过</tspan></text><path d="M 130 475 V 320 H 220" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 600 630 H 758 V 130 H 600" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="690" y="270" text-anchor="middle" class="label"><tspan x="690" dy="0">范围或</tspan><tspan x="690" dy="23">输入变化</tspan></text><text x="410" y="702" text-anchor="middle" class="note"><tspan x="410" dy="0">延期和阻塞保留在交接记录中，不计为验收通过。</tspan></text>
<path d="M 130 535 V 630 H 220" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="117" y="577" text-anchor="end" class="label">保留风险</text>
</svg>
