schema: ui-system-adapter/v1
id: tdesign-uniapp
version: "0.1.0-experimental"
status: experimental
stack_compatibility:
  adapter: uni-app
  framework: vue
policy_support: [required, preferred]
documentation:
  authority_order: [installed_types, versioned_source, official_docs, llms_txt, mcp]
  mcp_capabilities: [component_list, component_docs, component_dom, component_changelog]
components:
  - { name: Button, semantic: action }
  - { name: Input, semantic: text-input }
  - { name: Popup, semantic: overlay }
  - { name: Dialog, semantic: confirmation }
  - { name: Loading, semantic: loading }
  - { name: Skeleton, semantic: loading-placeholder }
  - { name: Empty, semantic: empty-state }
  - { name: Calendar, semantic: date-range-picker }
semantic_mapping:
  primary-action: { component: Button, props: { theme: primary, block: true } }
  secondary-action: { component: Button, props: { theme: default, variant: outline } }
  confirmation-dialog: { component: Dialog }
  bottom-sheet: { component: Popup, props: { placement: bottom } }
  loading-state: { component: Loading }
  content-skeleton: { component: Skeleton }
  empty-state: { component: Empty }
  date-range: { component: Calendar, props: { type: range } }
token_mapping:
  color.brand.primary: --td-brand-color
  color.text.primary: --td-text-color-primary
  color.surface.page: --td-bg-color-page
  radius.control: --td-radius-default
  size.control.large: --td-comp-size-xxxl
constraints:
  - id: prefer-system-component
    severity: warning
    message: UI System 已有语义组件时优先复用，不重复实现基础控件。
  - id: no-internal-dom-overrides
    severity: failure
    message: 不直接覆盖组件内部 DOM class；优先使用 Props、Slots 和 Token。
  - id: versioned-evidence
    severity: failure
    message: llms.txt 或 MCP 证据必须记录与安装版本的对应关系。
  - id: runtime-dependency-lifecycle
    severity: failure
    message: 实际使用的 UI runtime 必须作为锁定的生产依赖保留；仅试用且源码未引用时才移除，更换框架必须先迁移和验证。
