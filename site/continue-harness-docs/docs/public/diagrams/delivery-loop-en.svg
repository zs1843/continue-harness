<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 730" role="img" aria-labelledby="title desc">
<title id="title">Delivery and acceptance</title><desc id="desc">Define criteria, implement, verify and hand off. Failed acceptance requires changes or recorded risks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527273"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173e40;font-size:17px}.title{font-size:25px;font-weight:650}.note{font-size:15px;fill:#516c70}.label{font-size:15px;font-weight:600}</style>
<rect width="820" height="730" rx="16" fill="#f8fbfb"/><text x="32" y="43" class="title">Delivery and acceptance</text>
<text x="410" y="77" text-anchor="middle" class="note"><tspan x="410" dy="0">Define acceptance criteria before implementation.</tspan></text><rect x="220" y="100" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="136" text-anchor="middle" class=""><tspan x="410" dy="0">Confirm requirements and scope</tspan></text><rect x="220" y="195" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="231" text-anchor="middle" class=""><tspan x="410" dy="0">Define acceptance items</tspan></text><rect x="220" y="290" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="326" text-anchor="middle" class=""><tspan x="410" dy="0">Implement linked work items</tspan></text><rect x="220" y="385" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="421" text-anchor="middle" class=""><tspan x="410" dy="0">Run checks and collect evidence</tspan></text><rect x="220" y="600" width="380" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="636" text-anchor="middle" class=""><tspan x="410" dy="0">Save handoff state and snapshot</tspan></text><path d="M 410 469 L 520 505 L 410 541 L 300 505 Z" fill="#fff3dd" stroke="#bda36b"/><text x="410" y="510" text-anchor="middle" class=""><tspan x="410" dy="0">Accepted?</tspan></text><rect x="30" y="475" width="205" height="60" rx="10" fill="#fff3dd" stroke="#82aaa6"/><text x="132.5" y="499.5" text-anchor="middle" class=""><tspan x="132.5" dy="0">Fix or record</tspan><tspan x="132.5" dy="23">a blocker / deferral</tspan></text><path d="M 410 160 V 195" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 255 V 290" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 350 V 385" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 445 V 469" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 541 V 600" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300 505 H 235" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><text x="443" y="576" text-anchor="middle" class="label"><tspan x="443" dy="0">Yes</tspan></text><text x="264" y="489" text-anchor="middle" class="label"><tspan x="264" dy="0">No</tspan></text><path d="M 130 475 V 320 H 220" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 600 630 H 758 V 130 H 600" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="690" y="270" text-anchor="middle" class="label"><tspan x="690" dy="0">Scope or</tspan><tspan x="690" dy="23">input changes</tspan></text><text x="410" y="702" text-anchor="middle" class="note"><tspan x="410" dy="0">Deferred and blocked work remains visible in handoff; it is not accepted.</tspan></text>
<path d="M 130 535 V 630 H 220" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="117" y="577" text-anchor="end" class="label">Keep risks</text>
</svg>
