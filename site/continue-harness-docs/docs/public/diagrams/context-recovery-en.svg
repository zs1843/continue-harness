<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 750" role="img" aria-labelledby="title desc">
<title id="title">Restore project context</title><desc id="desc">Restore facts, tasks and execution records; check report applicability before continuing or re-verifying.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527273"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173e40;font-size:17px}.title{font-size:25px;font-weight:650}.note{font-size:15px;fill:#516c70}.label{font-size:15px;font-weight:600}</style>
<rect width="820" height="750" rx="16" fill="#f8fbfb"/><text x="32" y="43" class="title">Restore project context</text>
<text x="410" y="78" text-anchor="middle" class="note"><tspan x="410" dy="0">Restore recorded project state, then check the selected task.</tspan></text><rect x="22" y="108" width="246" height="80" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="145" y="142.5" text-anchor="middle" class=""><tspan x="145" dy="0">Project facts</tspan><tspan x="145" dy="23">Scope · status · decisions</tspan></text><rect x="287" y="108" width="246" height="80" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="142.5" text-anchor="middle" class=""><tspan x="410" dy="0">Task and inputs</tspan><tspan x="410" dy="23">Sources · acceptance links</tspan></text><rect x="552" y="108" width="246" height="80" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="675" y="142.5" text-anchor="middle" class=""><tspan x="675" dy="0">Execution records</tspan><tspan x="675" dy="23">Logs · reports · snapshots</tspan></text><rect x="210" y="260" width="400" height="70" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="289.5" text-anchor="middle" class=""><tspan x="410" dy="0">Restore project context</tspan><tspan x="410" dy="23">Keep references to source files</tspan></text><path d="M 410 370 L 585 420 L 410 470 L 235 420 Z" fill="#fff3dd" stroke="#bda36b"/><text x="410" y="425" text-anchor="middle" class=""><tspan x="410" dy="0">Report still applicable?</tspan></text><rect x="30" y="548" width="345" height="88" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="202.5" y="586.5" text-anchor="middle" class=""><tspan x="202.5" dy="0">Check acceptance and risks</tspan><tspan x="202.5" dy="23">Continue from recorded next steps</tspan></text><rect x="445" y="548" width="345" height="88" rx="10" fill="#fff3dd" stroke="#82aaa6"/><text x="617.5" y="586.5" text-anchor="middle" class=""><tspan x="617.5" dy="0">Mark for confirmation</tspan><tspan x="617.5" dy="23">Review changes and verify again</tspan></text><path d="M 145 188 V 224 H 410 V 260" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 188 V 260" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 675 188 V 224 H 410" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 330 V 370" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 235 420 H 202 V 548" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 585 420 H 617 V 548" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><text x="159" y="476" text-anchor="middle" class="label"><tspan x="159" dy="0">Yes</tspan></text><text x="713" y="476" text-anchor="middle" class="label"><tspan x="713" dy="0">No / missing</tspan></text><text x="410" y="693" text-anchor="middle" class="note"><tspan x="410" dy="0">A matching report does not replace acceptance review.</tspan><tspan x="410" dy="23">Source history stays in Git; project documents require maintenance.</tspan></text>
</svg>
