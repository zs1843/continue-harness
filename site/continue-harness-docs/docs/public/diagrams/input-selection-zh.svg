<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 764" role="img" aria-labelledby="title desc">
<title id="title">按项目与任务选择输入</title><desc id="desc">需要则确认来源登记，不适用则记录原因，未知项继续询问。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527273"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#173e40;font-size:17px}.title{font-size:25px;font-weight:650}.note{font-size:15px;fill:#516c70}.label{font-size:15px;font-weight:600}</style>
<rect width="820" height="764" rx="16" fill="#f8fbfb"/><text x="32" y="43" class="title">按项目与任务选择输入</text>
<text x="410" y="78" text-anchor="middle" class="note"><tspan x="410" dy="0">项目类型提供候选问题，实际任务决定输入是否适用。</tspan></text><rect x="200" y="108" width="420" height="70" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="137.5" text-anchor="middle" class=""><tspan x="410" dy="0">确认项目事实</tspan><tspan x="410" dy="23">目标 · 项目类型 · 技术栈 · 任务范围</tspan></text><rect x="200" y="226" width="420" height="60" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="262" text-anchor="middle" class=""><tspan x="410" dy="0">通过对话确认候选输入</tspan></text><path d="M 410 322 L 525 364 L 410 406 L 295 364 Z" fill="#fff3dd" stroke="#bda36b"/><text x="410" y="369" text-anchor="middle" class=""><tspan x="410" dy="0">当前任务需要？</tspan></text><rect x="20" y="464" width="235" height="76" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="137.5" y="496.5" text-anchor="middle" class=""><tspan x="137.5" dy="0">不适用</tspan><tspan x="137.5" dy="23">记录原因，不创建占位文件</tspan></text><rect x="292" y="464" width="236" height="76" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="496.5" text-anchor="middle" class=""><tspan x="410" dy="0">确认来源</tspan><tspan x="410" dy="23">登记版本或哈希</tspan></text><rect x="565" y="464" width="235" height="76" rx="10" fill="#fff3dd" stroke="#82aaa6"/><text x="682.5" y="496.5" text-anchor="middle" class=""><tspan x="682.5" dy="0">保留待确认状态</tspan><tspan x="682.5" dy="23">补充必要事实</tspan></text><rect x="260" y="596" width="300" height="66" rx="10" fill="#e9f3f2" stroke="#82aaa6"/><text x="410" y="623.5" text-anchor="middle" class=""><tspan x="410" dy="0">登记并关联任务</tspan><tspan x="410" dy="23">manifest → 验收记录</tspan></text><path d="M 410 178 V 226" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 286 V 322" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 295 364 H 138 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 406 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 525 364 H 682 V 464" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 540 V 596" fill="none" stroke="#527273" stroke-width="2" marker-end="url(#arrow)"/><text x="189" y="349" text-anchor="middle" class="label"><tspan x="189" dy="0">不需要</tspan></text><text x="443" y="440" text-anchor="middle" class="label"><tspan x="443" dy="0">需要</tspan></text><text x="626" y="348" text-anchor="middle" class="label"><tspan x="626" dy="0">尚不明确</tspan></text><path d="M 800 502 H 809 V 256 H 620" fill="none" stroke="#527273" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="410" y="710" text-anchor="middle" class="note"><tspan x="410" dy="0">支持项目自定义输入类型。</tspan><tspan x="410" dy="23">UI、API 和 Design Token 均按任务需要选择。</tspan></text>
</svg>
