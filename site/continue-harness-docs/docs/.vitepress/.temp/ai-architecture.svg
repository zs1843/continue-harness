<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">continue-harness AI collaboration architecture</title>
  <desc id="desc">Layered architecture showing humans, agents, project evidence, CLI, Core, adapters, verification and reports.</desc>
  <rect width="1280" height="820" fill="#fffdf8"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f6f73"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif" fill="#202124">
    <text x="60" y="58" font-size="30" font-weight="800">continue-harness AI 协作架构</text>
    <text x="60" y="88" font-size="16" fill="#5f6368">人定义权威事实，Agent 执行工作流，Core 执行通用协议，项目保留证据与验收结果。</text>
  </g>

  <g stroke="#d9d4c9" stroke-width="2" fill="#ffffff">
    <rect x="60" y="128" width="240" height="168" rx="10"/>
    <rect x="360" y="128" width="250" height="168" rx="10"/>
    <rect x="670" y="128" width="250" height="168" rx="10"/>
    <rect x="980" y="128" width="240" height="168" rx="10"/>

    <rect x="60" y="356" width="250" height="300" rx="12" fill="#f7f4ed"/>
    <rect x="370" y="356" width="310" height="300" rx="12" fill="#fffdf8"/>
    <rect x="740" y="356" width="220" height="300" rx="12" fill="#f7f4ed"/>
    <rect x="1010" y="356" width="210" height="300" rx="12" fill="#fffdf8"/>

    <rect x="60" y="706" width="1160" height="68" rx="10" fill="#eef6f4"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#202124">
    <text x="86" y="166" font-size="22" font-weight="800">人</text>
    <text x="86" y="198" font-size="15">确认业务目标</text>
    <text x="86" y="224" font-size="15">确认视觉权威</text>
    <text x="86" y="250" font-size="15">确认接口选择</text>
    <text x="86" y="276" font-size="15">处理冲突和延期</text>

    <text x="386" y="166" font-size="22" font-weight="800">AI Agent</text>
    <text x="386" y="198" font-size="15">Codex / Claude / Cursor</text>
    <text x="386" y="224" font-size="15">读取 AGENTS.md</text>
    <text x="386" y="250" font-size="15">调用聚合 Skill</text>
    <text x="386" y="276" font-size="15">按任务加载证据</text>

    <text x="696" y="166" font-size="22" font-weight="800">项目证据</text>
    <text x="696" y="198" font-size="15">PRD / RP / UI</text>
    <text x="696" y="224" font-size="15">API / assets</text>
    <text x="696" y="250" font-size="15">Design Token</text>
    <text x="696" y="276" font-size="15">历史和快照</text>

    <text x="1006" y="166" font-size="22" font-weight="800">CLI</text>
    <text x="1006" y="198" font-size="15">create / init</text>
    <text x="1006" y="224" font-size="15">inputs / task</text>
    <text x="1006" y="250" font-size="15">doctor / verify</text>
    <text x="1006" y="276" font-size="15">skills / api / ui</text>

    <text x="86" y="396" font-size="24" font-weight="800">Core</text>
    <text x="86" y="430" font-size="15">config loader</text>
    <text x="86" y="456" font-size="15">runtime validation</text>
    <text x="86" y="482" font-size="15">init/create planner</text>
    <text x="86" y="508" font-size="15">doctor diagnostics</text>
    <text x="86" y="534" font-size="15">verification runner</text>
    <text x="86" y="560" font-size="15">reports and logs</text>
    <text x="86" y="586" font-size="15">input analysis</text>
    <text x="86" y="612" font-size="15">managed-file guard</text>

    <text x="396" y="396" font-size="24" font-weight="800">适配层</text>
    <text x="396" y="430" font-size="15">Product Profile: consumer-h5</text>
    <text x="396" y="456" font-size="15">页面形态、需求闭环、输入优先级</text>
    <text x="396" y="492" font-size="15">Platform: web-mobile</text>
    <text x="396" y="518" font-size="15">移动视口、浏览器运行、视觉验收</text>
    <text x="396" y="554" font-size="15">Stack: uni-app</text>
    <text x="396" y="580" font-size="15">Vue 3、Vite、pages.json、Playwright</text>
    <text x="396" y="616" font-size="15">UI System: optional mapping</text>

    <text x="766" y="396" font-size="24" font-weight="800">项目配置</text>
    <text x="766" y="430" font-size="15">.continue-harness/project.yaml</text>
    <text x="766" y="456" font-size="15">command mapping</text>
    <text x="766" y="482" font-size="15">verify modes</text>
    <text x="766" y="508" font-size="15">facts paths</text>
    <text x="766" y="534" font-size="15">sources / ui / api</text>

    <text x="1036" y="396" font-size="24" font-weight="800">输出</text>
    <text x="1036" y="430" font-size="15">tmp/continue-harness</text>
    <text x="1036" y="456" font-size="15">JSON / Markdown</text>
    <text x="1036" y="482" font-size="15">command logs</text>
    <text x="1036" y="508" font-size="15">task snapshots</text>
    <text x="1036" y="534" font-size="15">coverage rows</text>

    <text x="90" y="748" font-size="17" font-weight="800">边界：</text>
    <text x="150" y="748" font-size="16">Core 不直接理解业务；Profile/Platform/Stack 描述规则；项目拥有业务、接口、设计和 Token 权威；人处理冲突和决策。</text>
  </g>

  <g stroke="#2f6f73" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 212 H360"/>
    <path d="M610 212 H670"/>
    <path d="M920 212 H980"/>
    <path d="M1100 296 V356"/>
    <path d="M1010 506 H960"/>
    <path d="M740 506 H680"/>
    <path d="M370 506 H310"/>
    <path d="M185 656 V706"/>
    <path d="M525 656 V706"/>
    <path d="M850 656 V706"/>
    <path d="M1110 656 V706"/>
  </g>
</svg>
